<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept Invite - Stickers Generator</title>
    <link rel="stylesheet" href="css/admin.css">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .invite-card {
            width: min(420px, 92vw);
            background: rgba(18, 18, 18, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 28px;
        }
        .invite-card h1 { font-size: 1.4rem; margin: 0 0 8px; }
        .invite-card p { color: #9aa0a6; margin: 0 0 18px; }
        .invite-card input {
            width: 100%;
            margin-bottom: 12px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 4px;
            color: #e0e0e0;
        }
        .invite-card .btn-primary { width: 100%; }
        .invite-error { color: #ff6b6b; margin-top: 12px; font-size: 0.9em; }
        .invite-success { color: #4caf50; margin-top: 12px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="invite-card">
        <h1>Activate your account</h1>
        <p>Set a password to finish joining Lumetry Stickers.</p>
        <input type="text" id="inviteName" placeholder="Your name (optional)">
        <input type="password" id="invitePassword" placeholder="Password (min 8 characters)" autocomplete="new-password">
        <input type="password" id="invitePasswordConfirm" placeholder="Confirm password" autocomplete="new-password">
        <button class="btn-primary" id="acceptBtn" onclick="acceptInvite()">Activate account</button>
        <div id="inviteMessage"></div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/accept-invite.js"></script>
</body>
</html>
